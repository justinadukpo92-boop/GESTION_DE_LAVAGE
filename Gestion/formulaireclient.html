<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bidè - Fiche Client</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- CSS perso -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="d-flex">

    <!-- SIDEBAR -->
    <aside class="sidebar d-flex flex-column p-3">
      <div class="sidebar-brand d-flex align-items-center mb-4">
        <img src="images/logo-bide.png" alt="Logo Bidè" class="logo-img me-2">
        <div>
          <h5 class="mb-0 text-primary fw-bold">Bidè</h5>
          <small class="text-muted">Gestion Lavage</small>
        </div>
      </div>

      <nav class="nav flex-column flex-grow-1">
        <a href="dashbord.html" class="nav-link sidebar-link">
          <i class="bi bi-grid-1x2 me-2"></i> Dashboard
        </a>
        <a href="listedesclients.html" class="nav-link sidebar-link active">
          <i class="bi bi-people me-2"></i> Clients
        </a>
        <a href="listedesvehicules.html" class="nav-link sidebar-link">
          <i class="bi bi-car-front me-2"></i> Véhicules
        </a>
        <a href="cataloguedesprestations.html" class="nav-link sidebar-link">
          <i class="bi bi-droplet me-2"></i> Prestations
        </a>
        <a href="listedescommandes.html" class="nav-link sidebar-link">
          <i class="bi bi-cart3 me-2"></i> Commandes
        </a>
        <a href="parametres.html" class="nav-link sidebar-link">
          <i class="bi bi-gear me-2"></i> Paramètres
        </a>
        <a href="statistiques.html" class="nav-link sidebar-link">
          <i class="bi bi-bar-chart me-2"></i> Stats
        </a>
        <a href="faq.html" class="nav-link sidebar-link">
          <i class="bi bi-question-circle me-2"></i> FAQ
        </a>
      </nav>

      <a href="#" class="nav-link sidebar-link mt-auto">
        <i class="bi bi-person-circle me-2"></i> Mon Profil
      </a>
    </aside>

    <!-- CONTENU PRINCIPAL (arrière-plan derrière la modale) -->
    <main class="main-content flex-grow-1 p-4">
      <header class="topbar d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Répertoire des Clients</h4>
        <div class="d-flex align-items-center gap-3">
          <i class="bi bi-bell fs-5"></i>
          <img src="images/Profil3.jpg" alt="Utilisateur" class="avatar-img">
        </div>
      </header>
      <p class="text-muted">La fiche client s'ouvre dans une fenêtre modale ci-dessus.</p>
    </main>
  </div>

  <!-- MODALE FICHE CLIENT -->
  <div class="modal fade show d-block" id="modalFicheClient" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content fiche-client-modal">

        <!-- Header modale -->
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title fw-bold">Fiche Client</h5>
            <p class="text-muted small mb-0">Créer ou modifier les informations du client</p>
          </div>
          <button type="button" class="btn-close" id="btnFermerModal"></button>
        </div>

        <hr>

        <!-- Corps modale -->
        <div class="modal-body pt-0">
          <form id="formClient">

            <!-- Type de client -->
            <label class="section-label">TYPE DE CLIENT</label>
            <div class="row g-2 mb-4">
              <div class="col-6">
                <label class="type-client-option d-flex align-items-center gap-2 p-3">
                  <input type="radio" name="typeClient" value="particulier" checked>
                  <i class="bi bi-person fs-5"></i>
                  <span>Particulier</span>
                </label>
              </div>
              <div class="col-6">
                <label class="type-client-option d-flex align-items-center gap-2 p-3">
                  <input type="radio" name="typeClient" value="entreprise">
                  <i class="bi bi-building fs-5"></i>
                  <span>Entreprise</span>
                </label>
              </div>
            </div>

            <!-- Identité -->
            <label class="section-label">IDENTITÉ</label>
            <hr class="mt-1">
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" placeholder="Ex: ADUKPO" required>
              </div>
              <div class="col-md-6">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="prenom" placeholder="Ex: Kodzovi" required>
              </div>
            </div>

            <!-- Contact & Localisation -->
            <label class="section-label">CONTACT &amp; LOCALISATION</label>
            <hr class="mt-1">
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="telephone" class="form-label">Téléphone principal</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                  <input type="tel" class="form-control" id="telephone" placeholder="+228 XX XX XX XX" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="whatsapp" class="form-label">WhatsApp</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-whatsapp"></i></span>
                  <input type="tel" class="form-control" id="whatsapp" placeholder="+228 XX XX XX XX">
                </div>
              </div>
              <div class="col-12">
                <label for="emailClient" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="emailClient" placeholder="client@exemple.com">
                </div>
              </div>
              <div class="col-12">
                <label for="quartier" class="form-label">Quartier / Ville</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-geo-alt"></i></span>
                  <input type="text" class="form-control" id="quartier" placeholder="Ex: Golfe 1, Bè, Hedzranawoé - Lomé">
                </div>
              </div>
            </div>

            <!-- Notes internes -->
            <label class="section-label">NOTES INTERNES</label>
            <hr class="mt-1">
            <div class="mb-2">
              <textarea class="form-control" id="notesInternes" rows="3" placeholder="Ex: Client fidèle, préfère les rendez-vous le matin..."></textarea>
            </div>

          </form>
        </div>

        <!-- Footer modale -->
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" id="btnAnnulerClient">Annuler</button>
          <button type="submit" form="formClient" class="btn btn-primary" id="btnEnregistrerClient">
            Enregistrer le client
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-muted py-3">
    <small>&copy; 2026 Bidè - Gestion Lavage. Tous droits réservés.</small>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS perso -->
  <script src="js/script.js"></script>
</body>
</html>
