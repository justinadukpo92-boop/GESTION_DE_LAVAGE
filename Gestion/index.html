<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bidè - Connexion</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- CSS perso -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <main class="login-wrapper d-flex align-items-center justify-content-center">

    <div class="card login-card p-5">

      <!-- Logo + titre -->
      <div class="text-center mb-4">
        <img src="images/logo-bide.png" alt="Logo Bidè" class="login-logo mb-3">
        <h2 class="fw-bold text-primary mb-1">Bidè</h2>
        <p class="mb-1">Connexion à la plateforme de gestion</p>
        <small class="text-muted fw-bold">AKIMMAKO, LOMÉ, TOGO</small>
      </div>

      <!-- Formulaire -->
      <form id="formConnexion">

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Adresse email</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="nom@entreprise.tg" required>
          </div>
        </div>

        <!-- Mot de passe -->
        <div class="mb-3">
          <label for="motDePasse" class="form-label">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="motDePasse" placeholder="••••••••" required>
            <span class="input-group-text bg-white toggle-password" id="togglePassword">
              <i class="bi bi-eye"></i>
            </span>
          </div>
        </div>

        <!-- Se souvenir / mot de passe oublié -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="seSouvenir">
            <label class="form-check-label" for="seSouvenir">
              Se souvenir de moi
            </label>
          </div>
          <a href="#" class="text-decoration-none">Mot de passe oublié ?</a>
        </div>

        <!-- Bouton connexion -->
        <button type="submit" class="btn btn-primary w-100 btn-connexion">
          Se connecter
        </button>

      </form>

      <hr class="my-4">

      <!-- Support -->
      <div class="text-center">
        <small class="text-muted">
          Problème d'accès ? <a href="#" class="text-decoration-none">Contacter le support</a>
        </small>
      </div>

    </div>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS perso -->
  <script src="js/script.js"></script>
</body>
</html>
